<div style="background: var(--surface-1); border-radius: 12px; padding: 2.5rem 1rem 1rem;">
  <h2 class="sr-only">Mockup of the bottom navigation bar unchanged with five items, and a separate Community floating action button positioned above and overlapping only the top edge of the bar, horizontally centered on the Schedule tab</h2>

  <div style="position: relative; max-width: 360px; margin: 0 auto;">
    <svg viewBox="0 0 360 64" width="100%" style="display:block; overflow: visible;" role="img">
      <title>Unmodified bottom nav bar</title>
      <rect x="0" y="0" width="360" height="64" rx="14" fill="var(--surface-2)" stroke="var(--border)" stroke-width="0.5"/>
    </svg>

    <div style="position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-evenly; padding: 0 6px;">
      <div style="display:flex; flex-direction:column; align-items:center; gap:3px; width:52px;">
        <i class="ti ti-home" style="font-size:20px; color: var(--text-accent);" aria-hidden="true"></i>
        <span style="font-size:10px; color: var(--text-accent);">Home</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:3px; width:52px;">
        <i class="ti ti-chart-bar" style="font-size:20px; color: var(--text-muted);" aria-hidden="true"></i>
        <span style="font-size:10px; color: var(--text-muted);">Performance</span>
      </div>
      <div id="sched-tab" style="display:flex; flex-direction:column; align-items:center; gap:3px; width:52px;">
        <i class="ti ti-calendar" style="font-size:20px; color: var(--text-muted);" aria-hidden="true"></i>
        <span style="font-size:10px; color: var(--text-muted);">Schedule</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:3px; width:52px;">
        <i class="ti ti-book" style="font-size:20px; color: var(--text-muted);" aria-hidden="true"></i>
        <span style="font-size:10px; color: var(--text-muted);">Ledger</span>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:3px; width:52px;">
        <i class="ti ti-message" style="font-size:20px; color: var(--text-muted);" aria-hidden="true"></i>
        <span style="font-size:10px; color: var(--text-muted);">Messages</span>
      </div>
    </div>

    <button aria-label="Community" style="position:absolute; top:-24px; left:50%; transform: translateX(-2px) translateX(-50%); width:52px; height:52px; border-radius:50%; background: var(--fill-accent); border: none; box-shadow: var(--shadow-md); display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <i class="ti ti-users-group" style="font-size:24px; color: var(--on-accent);" aria-hidden="true"></i>
    </button>
  </div>
</div>
