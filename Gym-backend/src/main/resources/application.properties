spring.application.name=gym-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/GYMBIOS
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson Configuration
# Serialize Java camelCase fields as snake_case JSON (matches frontend TypeScript interfaces)
spring.jackson.property-naming-strategy=SNAKE_CASE
# Serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# A 256-bit secure key (must be at least 256 bit for HMAC-SHA algorithms)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration time for JWT in milliseconds (e.g., 24 hours = 86400000 ms)
jwt.expiration=86400000

# Check-In / QR Configuration
# Secret used to HMAC-sign QR codes so any device can verify them offline.
# Change this in production — use a long random string, NOT the JWT secret.
checkin.hmac.secret=${CHECKIN_HMAC_SECRET:GymBiosQrHmacSecret-ChangeInProduction}

# Messaging Configuration
gym.name=${GYM_NAME:GymBios Fitness}
messaging.email.from=${MESSAGE_EMAIL_FROM:no-reply@gymbios.app}

# SMTP (Email) Configuration
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
