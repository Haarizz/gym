spring.application.name=gym-backend

# Active profile selects which application-{profile}.properties supplies the
# datasource + server.port below (local vs prod). Override with
# SPRING_PROFILES_ACTIVE=prod on the VPS; defaults to local for plain `mvn spring-boot:run`.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.driver-class-name=org.postgresql.Driver

# No schema.sql/data.sql files exist anywhere in this project (Flyway owns all schema
# work) — this auto-initializer bean is otherwise pure dead weight, and Phase 5's
# TenantDataSourceRegistry (primary dataSource -> control-plane TenantRepository)
# turned it into one leg of a real bean-dependency cycle at startup (dataSource ->
# dataSourceScriptDatabaseInitializer -> ... -> controlPlaneEntityManagerFactory ->
# tenantRepository -> tenantDataSourceRegistry -> dataSource). Disabling it removes
# that leg without weakening any real dependency.
spring.sql.init.enabled=false

# JPA/Hibernate Properties
# ddl-auto=validate: confirmed 2026-08-06 by booting Hibernate 6.4.4.Final's real
# SchemaValidator (the same version/mechanism this app uses) standalone against every
# @Entity in this module and the live GYMBIOS database — all 93 entities matched the
# schema exactly, so it's safe to stop letting Hibernate silently alter the schema on
# boot. Schema changes now go exclusively through versioned files under
# src/main/resources/db/migration (see V1-V8).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migration tooling
# baseline-on-migrate lets Flyway adopt this existing database without a hand-written
# script that reproduces the whole live schema from scratch. baseline-version=0 means
# the live database is treated as being at version 0, so migrations V1+ below are
# genuinely new and will be applied on top of it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Jackson Configuration
# Serialize Java camelCase fields as snake_case JSON (matches frontend TypeScript interfaces)
spring.jackson.property-naming-strategy=SNAKE_CASE
# Serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# A 256-bit secure key (must be at least 256 bit for HMAC-SHA algorithms). The
# literal default below is the value this codebase has always hardcoded here —
# kept ONLY as the fallback for local dev with zero setup. Production MUST set
# JWT_SECRET to a real, distinct random value via the systemd unit's Environment=.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiration time for JWT in milliseconds (e.g., 24 hours = 86400000 ms)
jwt.expiration=86400000

# Check-In / QR Configuration
# Secret used to HMAC-sign QR codes so any device can verify them offline.
# Change this in production — use a long random string, NOT the JWT secret.
checkin.hmac.secret=${CHECKIN_HMAC_SECRET:GymBiosQrHmacSecret-ChangeInProduction}

# Messaging Configuration
gym.name=${GYM_NAME:GymBios Fitness}
messaging.email.from=${MESSAGE_EMAIL_FROM:no-reply@gymbios.app}

# SMTP (Email) Configuration
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# Control-plane database (Phase 1 multi-tenant groundwork): isolated, always-on
# tenant-registry DB. Not read/written by any existing feature — see
# controlplane.config.ControlPlaneDataSourceConfig. Same driver as the primary
# DataSource; url/username/password supplied per-profile below.
control-plane.datasource.driver-class-name=org.postgresql.Driver
control-plane.flyway.enabled=true
control-plane.flyway.locations=classpath:db/migration-control
control-plane.jpa.hibernate.ddl-auto=validate
control-plane.jpa.show-sql=true

# Tenant resolution & routing (Phase 2 multi-tenant groundwork): OFF by default —
# zero behavior change to auth or the DataSource. When true, AuthService embeds the
# logged-in user's gym slug as a "tenant" JWT claim, TenantContextFilter populates
# TenantContextHolder from it per-request, and PrimaryDataSourceConfig swaps its
# "dataSource" bean for a TenantRoutingDataSource. Until Phase 3 provisions real
# per-tenant databases, every tenant routes back to the same single primary DB —
# this only proves the mechanism end-to-end. Flip locally with
# -Dtenant.routing.enabled=true or TENANT_ROUTING_ENABLED=true.
tenant.routing.enabled=${TENANT_ROUTING_ENABLED:false}
tenant.routing.default-tenant-slug=${TENANT_ROUTING_DEFAULT_SLUG:default}

# Phase 3 multi-tenant provisioning: prefix used to derive each new tenant's
# physical database name from its slug (e.g. slug "acme-gym" -> database
# "gymbios_acme_gym"). See controlplane.service.TenantProvisioningService.
tenant.provisioning.db-name-prefix=gymbios_

# Phase 4: one-time, manually-triggered migration of an existing gym's real data
# into its own dedicated tenant database. Disabled by default; run once with
# -Dtenant.migration.enabled=true -Dtenant.migration.gym-id=<id> (or
# TENANT_MIGRATION_ENABLED/TENANT_MIGRATION_GYM_ID as env vars). See
# controlplane.migration.TenantDataMigrationRunner.
tenant.migration.enabled=${TENANT_MIGRATION_ENABLED:false}
tenant.migration.gym-id=${TENANT_MIGRATION_GYM_ID:1}

# Phase 5: one-time, manually-triggered backfill of user_directory for users in an
# already-migrated tenant database that predate the directory (Test Gym's 3 users,
# migrated in Phase 4 before this existed). Disabled by default; run once with
# -Duser-directory.backfill.enabled=true. See
# controlplane.backfill.UserDirectoryBackfillRunner.
user-directory.backfill.enabled=${USER_DIRECTORY_BACKFILL_ENABLED:false}

# Phase 7: key used to AES-encrypt each tenant's real Postgres role password before
# storing it in tenant_connections.db_credential_enc — see
# controlplane.service.CredentialEncryptionService. The literal default below is
# for local dev only. Production MUST set TENANT_CREDENTIAL_KEY to a real, distinct
# random value via the systemd unit's Environment= — losing/rotating this key makes
# every already-stored tenant credential undecryptable, so treat it like a real
# secret, not a config default.
tenant.credential-key=${TENANT_CREDENTIAL_KEY:local-dev-only-tenant-credential-key-CHANGE-IN-PRODUCTION}

# Phase 7: one-time, manually-triggered rollout of new Flyway migrations to every
# already-provisioned tenant database (schema changes made after a tenant was
# created never reach it automatically otherwise). Disabled by default; run once
# with -Dtenant.schema-migration.enabled=true. See
# controlplane.migration.TenantMigrationRunner. Distinct from tenant.migration.*
# above, which is an unrelated one-gym DATA migration (Phase 4).
tenant.schema-migration.enabled=${TENANT_SCHEMA_MIGRATION_ENABLED:false}
