spring.application.name=gym-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Gymbios
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway migration tooling
# baseline-on-migrate lets Flyway adopt this existing database without a hand-written
# script that reproduces the whole live schema from scratch. baseline-version=0 means
# the live database is treated as being at version 0, so migrations V1+ below are
# genuinely new and will be applied on top of it.
# NOTE: ddl-auto is intentionally left as "update" for now rather than flipped to
# "validate" — that switch should only happen after confirming, against a real copy
# of the database, that every entity matches the live schema exactly (not verified
# here). Going forward, schema changes should be added as versioned files under
# src/main/resources/db/migration instead of relying on ddl-auto.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Jackson Configuration
# Serialize Java camelCase fields as snake_case JSON (matches frontend TypeScript interfaces)
spring.jackson.property-naming-strategy=SNAKE_CASE
# Serialize dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# A 256-bit secure key (must be at least 256 bit for HMAC-SHA algorithms)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration time for JWT in milliseconds (e.g., 24 hours = 86400000 ms)
jwt.expiration=86400000

# Check-In / QR Configuration
# Secret used to HMAC-sign QR codes so any device can verify them offline.
# Change this in production — use a long random string, NOT the JWT secret.
checkin.hmac.secret=${CHECKIN_HMAC_SECRET:GymBiosQrHmacSecret-ChangeInProduction}

# Messaging Configuration
gym.name=${GYM_NAME:GymBios Fitness}
messaging.email.from=${MESSAGE_EMAIL_FROM:no-reply@gymbios.app}

# SMTP (Email) Configuration
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
