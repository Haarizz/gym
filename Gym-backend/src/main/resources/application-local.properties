spring.datasource.url=jdbc:postgresql://localhost:5432/GYMBIOS
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:admin}

# Local development uses Hibernate's schema generation for a clean database.
# Flyway cannot safely apply the legacy migration stack against a fresh schema
# because many migrations reference tables that do not exist until JPA creates them.
spring.flyway.enabled=false

# Control-plane DB shares the same local Postgres instance/credentials as the
# primary GYMBIOS database, just a different database name. Unlike the primary
# local profile, this does NOT disable Flyway: gymbios_control is always a
# brand-new schema with no legacy Hibernate-vs-migration ordering conflict (that
# problem is specific to GYMBIOS's pre-existing history), so Flyway can safely
# own it from V1 in every environment, including local dev. Create the database
# once locally with: CREATE DATABASE gymbios_control;
control-plane.datasource.url=jdbc:postgresql://localhost:5432/gymbios_control
control-plane.datasource.username=postgres
control-plane.datasource.password=${CONTROL_PLANE_DB_PASSWORD:admin}

# Phase 5 cutover: real per-tenant database routing verified end-to-end locally
# (login resolves via user_directory, TenantDataSourceRegistry routes to each
# tenant's own database, GYMBIOS_ADMIN/not-yet-migrated users fall through to the
# primary DB unaffected). Flipped on by default for local dev going forward.
tenant.routing.enabled=true
