# 9080 avoids BillBull's reserved 8080-8088 range on the shared VPS (77.37.49.42).
server.port=9080

spring.datasource.url=jdbc:postgresql://localhost:5432/GYMBIOS
spring.datasource.username=postgres
# Set the real value via the gymbios-backend systemd unit's Environment=DB_PASSWORD=...
# The fallback below is deliberately NOT a real-looking password (this property was
# previously hardcoded to the literal "root", contradicting this very comment, since
# no ${DB_PASSWORD} substitution was actually wired up) — it fails loudly and
# obviously if the systemd unit's env var is missing, rather than silently
# connecting with a guessable default in production.
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_DB_PASSWORD_NOT_SET}

spring.jpa.show-sql=false

# Control-plane DB: same host as the primary GYMBIOS database, different name.
control-plane.datasource.url=jdbc:postgresql://localhost:5432/gymbios_control
control-plane.datasource.username=postgres
# Set via the systemd unit's Environment=CONTROL_PLANE_DB_PASSWORD=... — see the
# comment on spring.datasource.password above for why the fallback is deliberately
# non-functional rather than a real-looking literal.
control-plane.datasource.password=${CONTROL_PLANE_DB_PASSWORD:CHANGE_ME_CONTROL_PLANE_DB_PASSWORD_NOT_SET}
control-plane.jpa.show-sql=false

# Phase 7: real per-tenant credential encryption key — MUST be set via the systemd
# unit's Environment=TENANT_CREDENTIAL_KEY=... in production. See
# controlplane.service.CredentialEncryptionService and the base application.properties
# comment on this same key for why the fallback here is deliberately non-functional.
tenant.credential-key=${TENANT_CREDENTIAL_KEY:CHANGE_ME_TENANT_CREDENTIAL_KEY_NOT_SET}

# Phase 7: JWT signing secret — MUST be set via the systemd unit's
# Environment=JWT_SECRET=... in production, distinct from the local-dev default in
# the base application.properties.
jwt.secret=${JWT_SECRET:CHANGE_ME_JWT_SECRET_NOT_SET}
