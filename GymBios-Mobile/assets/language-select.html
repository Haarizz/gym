<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choose Language</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&family=Noto+Sans+Kannada:wght@500;700&family=Noto+Sans+Telugu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f4f8;
    --ink:#1f2433;
    --ink-2:#4a5068;
    --muted:#8a90a6;
    --amber-1:#f8d977;
    --amber-2:#f4b54a;
    --amber-ink:#4a3504;
    --teal:#2f6e60;
    --teal-2:#4b7a6f;
    --line:#e7e8ef;
    --glass:rgba(255,255,255,.72);
    --shadow:0 10px 30px -12px rgba(31,36,51,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Plus Jakarta Sans","Noto Sans Malayalam","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Telugu",system-ui,sans-serif;
    color:var(--ink);background:#dfe2ea;display:flex;align-items:center;justify-content:center;
  }

  /* phone frame for desktop preview */
  .phone{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);
    box-shadow:0 30px 80px -20px rgba(0,0,0,.35),0 0 0 10px #111,0 0 0 11px #333;display:flex;flex-direction:column}
  @media (max-width:500px){
    body{display:block;background:var(--bg)}
    .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  }

  /* warm background glow, same as Home */
  .phone::before,.phone::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
  .phone::before{width:460px;height:460px;top:-200px;right:-200px;background:radial-gradient(circle,rgba(248,217,119,.55),rgba(248,217,119,0) 70%)}
  .phone::after{width:380px;height:380px;bottom:-160px;left:-180px;background:radial-gradient(circle,rgba(75,122,111,.18),rgba(75,122,111,0) 70%)}

  .top{position:relative;z-index:1;padding:52px 22px 18px}
  .globe{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;margin-bottom:18px;
    background:linear-gradient(135deg,var(--amber-1),var(--amber-2));box-shadow:0 12px 24px -10px rgba(244,181,74,.8),inset 0 1px 0 rgba(255,255,255,.6)}
  h1{margin:0;font-size:27px;line-height:1.25;font-weight:800;letter-spacing:-.015em;min-height:34px;transition:opacity .2s}
  .sub{margin:8px 0 0;color:var(--ink-2);font-size:14.5px}
  .fade{opacity:0}

  /* grid */
  .grid{position:relative;z-index:1;flex:1;overflow-y:auto;padding:6px 22px 130px;
    display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
  .lang{position:relative;height:150px;border-radius:24px;padding:16px;cursor:pointer;text-align:left;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1.5px solid rgba(255,255,255,.8);box-shadow:var(--shadow);
    display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;font:inherit;color:inherit;
    transition:transform .15s ease,border-color .2s,background .25s,box-shadow .25s;
    opacity:0;transform:translateY(12px);animation:in .45s ease forwards}
  .lang:active{transform:scale(.97)}
  @keyframes in{to{opacity:1;transform:none}}

  .lang .name{font-size:17px;font-weight:700;line-height:1.2}
  .lang .en{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
  .lang .hello{align-self:flex-end;font-size:26px;font-weight:700;line-height:1.1;text-align:right;color:#c9cdd8;transition:color .25s}
  .lang .hello.long{font-size:21px}

  .tick{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;border:1.5px solid #d3d6df;
    display:grid;place-items:center;background:rgba(255,255,255,.6);transition:.2s}
  .tick svg{opacity:0;transform:scale(.5);transition:.2s}

  .lang.sel{background:linear-gradient(140deg,#fbe9b4,#f6d37f);border-color:var(--amber-2);
    box-shadow:0 14px 30px -14px rgba(244,181,74,.9)}
  .lang.sel .en{color:#7a5d19}
  .lang.sel .hello{color:var(--amber-ink)}
  .lang.sel .tick{background:var(--teal);border-color:var(--teal)}
  .lang.sel .tick svg{opacity:1;transform:none}

  /* bottom action bar */
  .bar{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 22px calc(26px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 60%,rgba(243,244,248,0))}
  .btn{width:100%;height:56px;border-radius:18px;border:none;cursor:pointer;
    font:700 16px "Plus Jakarta Sans","Noto Sans Malayalam","Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Telugu",sans-serif;
    color:#fff;background:linear-gradient(120deg,var(--teal),var(--teal-2));box-shadow:0 10px 22px -10px rgba(47,110,96,.8);
    display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
  .note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}

  .toast{position:absolute;left:50%;bottom:120px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;
    font-size:13.5px;padding:12px 18px;border-radius:14px;transition:.3s;z-index:5;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <div class="globe">
      <svg width="26" height="26" fill="none" stroke="#1f2433" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
    </div>
    <h1 id="title">Choose your language</h1>
    <p class="sub" id="sub">Pick the language you're most comfortable with</p>
  </header>

  <main class="grid" id="grid" role="radiogroup" aria-labelledby="title"></main>

  <div class="bar">
    <button class="btn" id="go" disabled>
      <span id="goText">Continue</span>
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
    <div class="note">You can change this anytime in Settings</div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const LANGS = [
  { code:'en', name:'English',  en:'English',   hello:'Hi',        title:'Choose your language',                go:'Continue',      sub:"Pick the language you're most comfortable with" },
  { code:'ml', name:'മലയാളം',  en:'Malayalam', hello:'നമസ്കാരം',  title:'നിങ്ങളുടെ ഭാഷ തിരഞ്ഞെടുക്കുക',     go:'തുടരുക',        sub:'Choose your language' },
  { code:'hi', name:'हिन्दी',    en:'Hindi',     hello:'नमस्ते',     title:'अपनी भाषा चुनें',                     go:'जारी रखें',      sub:'Choose your language' },
  { code:'ta', name:'தமிழ்',    en:'Tamil',     hello:'வணக்கம்',   title:'உங்கள் மொழியைத் தேர்ந்தெடுக்கவும்',  go:'தொடரவும்',      sub:'Choose your language' },
  { code:'kn', name:'ಕನ್ನಡ',     en:'Kannada',   hello:'ನಮಸ್ಕಾರ',   title:'ನಿಮ್ಮ ಭಾಷೆಯನ್ನು ಆಯ್ಕೆಮಾಡಿ',          go:'ಮುಂದುವರಿಸಿ',    sub:'Choose your language' },
  { code:'te', name:'తెలుగు',    en:'Telugu',    hello:'నమస్కారం',  title:'మీ భాషను ఎంచుకోండి',                 go:'కొనసాగించండి',  sub:'Choose your language' },
];

const grid = document.getElementById('grid');
const title = document.getElementById('title'), sub = document.getElementById('sub');
const go = document.getElementById('go'), goText = document.getElementById('goText');
let selected = null;

LANGS.forEach((l, i) => {
  const b = document.createElement('button');
  b.className = 'lang';
  b.setAttribute('role','radio');
  b.setAttribute('aria-checked','false');
  b.setAttribute('lang', l.code);
  b.style.animationDelay = (i * 60) + 'ms';
  b.innerHTML = `
    <div>
      <div class="name">${l.name}</div>
      ${l.code !== 'en' ? `<span class="en">${l.en}</span>` : ''}
    </div>
    <div class="hello ${l.hello.length > 6 ? 'long' : ''}">${l.hello}</div>
    <span class="tick"><svg width="14" height="14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7"/></svg></span>`;
  b.addEventListener('click', () => pick(l, b));
  grid.appendChild(b);
});

function pick(l, el){
  selected = l;
  document.querySelectorAll('.lang').forEach(c => {
    const on = c === el;
    c.classList.toggle('sel', on);
    c.setAttribute('aria-checked', on);
  });
  go.disabled = false;
  // preview the screen text in the chosen language
  [title, sub, goText].forEach(n => n.classList.add('fade'));
  setTimeout(() => {
    title.textContent = l.title; sub.textContent = l.sub; goText.textContent = l.go;
    title.setAttribute('lang', l.code); goText.setAttribute('lang', l.code);
    [title, sub, goText].forEach(n => n.classList.remove('fade'));
  }, 180);
  if (navigator.vibrate) navigator.vibrate(15);
}

go.addEventListener('click', () => {
  if (!selected) return;
  toast(`${selected.en} selected`);
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
