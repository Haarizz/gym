<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitZone Navbar</title>
<style>
:root{
  --bg:#F4F6FA; --card:#fff; --ink:#1B2433; --muted:#64748B;
  --teal:#2F7A68; --teal-deep:#1E5446; --teal-soft:#E3EEEA; --mint:#9FD6C6;
  --amber:#F5A524; --amber-deep:#E08A0B;
  --nav-h:68px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#dfe5ec;color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:400px;min-height:100vh;background:var(--bg);overflow:hidden}
@media(min-width:500px){.app{margin:24px 0;min-height:0;height:820px;border-radius:32px;box-shadow:0 20px 60px rgba(30,84,70,.25)}}
.screen{height:100%;overflow-y:auto;padding:20px 16px calc(var(--nav-h) + 56px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(27,36,51,.06)}
.card h3{font-size:17px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef1f5;font-size:14px;color:var(--muted)}
.row:last-child{border:0}.row b{color:var(--ink)}

/* ---------- NAVBAR ---------- */
.nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:var(--nav-h);
  background:linear-gradient(180deg,var(--teal) 0%,var(--teal-deep) 100%);
  border-radius:26px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;padding:0 6px;
  box-shadow:0 10px 28px rgba(30,84,70,.45),inset 0 1px 0 rgba(255,255,255,.14);z-index:20}
.tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;
  color:rgba(255,255,255,.72);font-size:11px;font-weight:600;letter-spacing:.1px;white-space:nowrap;transition:color .2s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab .ic{display:grid;place-items:center;width:46px;height:28px;border-radius:14px;transition:background .2s}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"] .ic{background:rgba(255,255,255,.2)}
.tab:focus-visible{outline:2px solid var(--amber);outline-offset:-4px;border-radius:16px}

/* center quick-action button */
.fab{all:unset;cursor:pointer;justify-self:center;position:relative;top:-24px;width:60px;height:60px;border-radius:50%;
  display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#FFC053,var(--amber-deep));
  border:5px solid var(--bg);
  box-shadow:0 8px 18px rgba(224,138,11,.45);transition:transform .25s}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.fab:active{transform:scale(.94)}
.fab:focus-visible{outline:2px solid var(--teal-deep);outline-offset:2px}
.fab[aria-expanded="true"] svg{transform:rotate(45deg)}
.fab-label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:rgba(255,255,255,.72);display:none}

/* quick actions sheet */
.scrim{position:absolute;inset:0;background:rgba(15,40,34,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.sheet{position:absolute;left:12px;right:12px;bottom:calc(var(--nav-h) + 36px + env(safe-area-inset-bottom,0px));z-index:15;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;transition:.25s}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{opacity:1;transform:none;pointer-events:auto}
.qa{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:18px;
  font-size:13px;font-weight:700;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.qa i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.qa svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qa:focus-visible{outline:2px solid var(--teal)}
.qa.a i{background:var(--amber)} .qa.b i{background:var(--teal)} .qa.c i{background:#7C5CE0} .qa.d i{background:var(--amber-deep)}
.qa.a{color:#8A5A06}.qa.b{color:var(--teal-deep)}.qa.c{color:#5B3FC0}.qa.d{color:#8A5A06}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="screen">
    <div class="card"><h3>Payment Mix</h3><p style="color:var(--muted);font-size:14px">No payments collected in this period.</p></div>
    <div class="card"><h3>Operational Highlights</h3>
      <div class="row">Staff Attendance<b>0</b></div>
      <div class="row">Today's Footfall<b>0 visits</b></div>
      <div class="row">Renewals Due<b>0 members</b></div>
      <div class="row">Pending Follow-ups<b>0 leads</b></div>
    </div>
    <div class="card" style="height:220px"><h3>Quick Actions</h3><p style="color:var(--muted);font-size:14px">Scroll content sits cleanly behind the floating bar.</p></div>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet">
    <button class="qa a"><i><svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/></svg></i>Create Offer</button>
    <button class="qa b"><i><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg></i>Add Staff</button>
    <button class="qa c"><i><svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg></i>View Reports</button>
    <button class="qa d"><i><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg></i>Manage Branch</button>
  </div>

  <nav class="nav" aria-label="Main">
    <button class="tab" aria-current="page"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10H3z"/><path d="M9 21v-6h6v6"/></svg></span>Home</button>
    <button class="tab"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg></span>Members</button>
    <button class="fab" id="fab" aria-label="Quick actions" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab"><span class="ic"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/></svg></span>Offers</button>
    <button class="tab"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg></span>Reports</button>
  </nav>
</div>
<script>
const app=document.getElementById('app'),fab=document.getElementById('fab');
const set=o=>{app.classList.toggle('open',o);fab.setAttribute('aria-expanded',o)};
fab.onclick=()=>set(!app.classList.contains('open'));
document.getElementById('scrim').onclick=()=>set(false);
document.querySelectorAll('.qa').forEach(b=>b.onclick=()=>set(false));
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.removeAttribute('aria-current'));
  t.setAttribute('aria-current','page');set(false);
});
</script>
</body>
</html>
