
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <!-- A browser that kept an old cached copy of this page after a deploy asks for
           bundle files the deploy deleted (404) and shows a blank page / dead login.
           Reload once: a reload revalidates this page, picking up the new bundle names. -->
      <script>
        (function () {
          var KEY = 'gymbios_stale_bundle_reload';
          var failed = false;
          window.addEventListener('error', function (e) {
            var t = e.target;
            if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
            if ((t.src || t.href || '').indexOf('/assets/') === -1) return;
            failed = true;
            try {
              if (sessionStorage.getItem(KEY)) return;
              sessionStorage.setItem(KEY, '1');
            } catch (_) { return; }
            location.reload();
          }, true);
          window.addEventListener('load', function () {
            if (!failed) { try { sessionStorage.removeItem(KEY); } catch (_) {} }
          });
        })();
      </script>
      <!-- Adjusted per route at runtime — see src/utils/responsive-scope.ts. -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#2B7A78" />
      <!-- Colour theme applied before first paint — see src/utils/theme.ts (keep ids/colours in sync).
           Signed out: brand teal. Signed in: the user's Settings > Theme choice, else Navy Blue (Graphite for the super admin). -->
      <script>
        (function () {
          var COLORS = { blue: '#1D4E89', teal: '#2B7A78', indigo: '#4F46E5', green: '#15803D', orange: '#C2410C', plum: '#714B67', graphite: '#334155', petrol: '#155E75', burgundy: '#9F1D35', mocha: '#7A4E2D' };
          var t = 'teal';
          try {
            var user = sessionStorage.getItem('token') && JSON.parse(sessionStorage.getItem('gymbios_user') || 'null');
            if (user && user.id) {
              var saved = localStorage.getItem('gymbios_theme:' + user.id);
              var norm = function (r) { return String(r || '').toLowerCase().replace(/^role_/, ''); };
              var roles = JSON.parse(sessionStorage.getItem('roles') || '[]');
              var superAdmin = roles.some(function (r) { return norm(r) === 'gymbios_admin'; }) || norm(sessionStorage.getItem('gymbios_role_name')) === 'gymbios_admin';
              t = COLORS.hasOwnProperty(saved) ? saved : (superAdmin ? 'graphite' : 'blue');
            }
          } catch (_) {}
          document.documentElement.setAttribute('data-gb-theme', t);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', COLORS[t]);
        })();
      </script>
